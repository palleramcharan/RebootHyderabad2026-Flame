---
name: "auditchain-network"
version: "1.0.0"

client:
  organization: Org1
  logging:
    level: info
  connection:
    timeout:
      peer:
        endorser: 300
        query: 120
      orderer: 120

organizations:
  Org1:
    mspid: Org1MSP
    peers:
      - peer0.org1.example.com
    certificateAuthorities:
      - ca-org1
    adminPrivateKey:
      path: ./organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore/priv_sk
    signedCert:
      path: ./organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/signcerts/Admin@org1.example.com-cert.pem

peers:
  peer0.org1.example.com:
    url: grpcs://peer0.org1.example.com:7051
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
      hostnameOverride: peer0.org1.example.com
    tlsCACerts:
      path: ./organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt

certificateAuthorities:
  ca-org1:
    url: https://localhost:7054
    httpOptions:
      verify: false
    tlsCACerts:
      path: ./organizations/peerOrganizations/org1.example.com/ca/ca.org1.example.com-cert.pem
    registrar:
      - enrollId: admin
        enrollSecret: adminpw
    caName: ca-org1

orderers:
  orderer0.example.com:
    url: grpcs://orderer0.example.com:7050
    grpcOptions:
      ssl-target-name-override: orderer0.example.com
      hostnameOverride: orderer0.example.com
    tlsCACerts:
      path: ./organizations/ordererOrganizations/example.com/orderers/orderer0.example.com/tls/ca.crt

channels:
  auditchannel:
    orderers:
      - orderer0.example.com
    peers:
      peer0.org1.example.com:
        endorsingPeer: true
        chaincodeQuery: true
        ledgerQuery: true
        eventSource: true
